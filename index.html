<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>TWatched</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TWatched">
<meta name="theme-color" content="#0F1320">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500;1,9..144,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ---------- tokens ---------- */
  :root{
    --bg: #F7F3EC;
    --surface: #FFFFFF;
    --surface-2: #FBF8F2;
    --text: #1B2036;
    --text-muted: #6B6F87;
    --border: rgba(27,32,54,0.13);
    --gold: #A9762A;
    --gold-strong: #7C5518;
    --teal: #16786F;
    --teal-strong: #0F5750;
    --danger: #A8402F;
    --font-display: 'Fraunces', Georgia, 'Times New Roman', serif;
    --font-body: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  @media (prefers-color-scheme: dark){
    html:not([data-theme="light"]){
      --bg:#0E121F; --surface:#171C2E; --surface-2:#1E2439; --text:#F3F1EA; --text-muted:#9AA0BE;
      --border: rgba(243,241,234,0.11); --gold:#E7B34C; --gold-strong:#F2C874; --teal:#4FD1C0; --teal-strong:#7BE0D1;
      --danger:#E4796C;
    }
  }
  html[data-theme="dark"]{
    --bg:#0E121F; --surface:#171C2E; --surface-2:#1E2439; --text:#F3F1EA; --text-muted:#9AA0BE;
    --border: rgba(243,241,234,0.11); --gold:#E7B34C; --gold-strong:#F2C874; --teal:#4FD1C0; --teal-strong:#7BE0D1;
    --danger:#E4796C;
  }

  /* Stats colours: validated categorical slots (identity) + one-hue blue ramp (status order / heatmap) */
  :root{
    --st-c1:#2a78d6; --st-c2:#eb6834; --st-c3:#1baf7a; --st-c4:#eda100; --st-c5:#e87ba4; --st-c6:#008300; --st-c7:#6250d6; --st-c8:#e34948;
    --st-s1:#86b6ef; --st-s2:#3987e5; --st-s3:#256abf; --st-s4:#0d366b; --st-bar:#2a78d6; --st-grid:rgba(27,32,54,0.08);
    --st-q0:#EFEAE0; --st-q1:#cde2fb; --st-q2:#86b6ef; --st-q3:#3987e5; --st-q4:#256abf; --st-q5:#0d366b;
  }
  @media (prefers-color-scheme: dark){ html:not([data-theme="light"]){ --st-c1:#3987e5; --st-c2:#d95926; --st-c3:#199e70; --st-c4:#c98500; --st-c5:#d55181; --st-c6:#008300; --st-c7:#9085e9; --st-c8:#e66767;
      --st-s1:#184f95; --st-s2:#256abf; --st-s3:#3987e5; --st-s4:#86b6ef; --st-bar:#3987e5; --st-grid:rgba(243,241,234,0.08);
      --st-q0:#232A40; --st-q1:#104281; --st-q2:#1c5cab; --st-q3:#2a78d6; --st-q4:#5598e7; --st-q5:#9ec5f4; } }
  html[data-theme="dark"]{ --st-c1:#3987e5; --st-c2:#d95926; --st-c3:#199e70; --st-c4:#c98500; --st-c5:#d55181; --st-c6:#008300; --st-c7:#9085e9; --st-c8:#e66767;
      --st-s1:#184f95; --st-s2:#256abf; --st-s3:#3987e5; --st-s4:#86b6ef; --st-bar:#3987e5; --st-grid:rgba(243,241,234,0.08);
      --st-q0:#232A40; --st-q1:#104281; --st-q2:#1c5cab; --st-q3:#2a78d6; --st-q4:#5598e7; --st-q5:#9ec5f4; }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  html{ overscroll-behavior:none; }
  /* #app used to be position:fixed, capped at window.innerHeight — which in an installed iOS
     PWA under-reports the true screen by a fixed, unrecoverable amount (a WebKit standalone-mode
     quirk), leaving a strip at the bottom no fixed-position element could ever paint into.
     #app is now normal, ordinary document flow instead — html/body scroll like a regular page,
     so there is no separate "app surface" height to fall short of; the page is simply as tall as
     its content, and scrolling reaches the true bottom like any other webpage (matching how the
     card app's shell already worked, which is why it never had this problem). background:var(--bg)
     here is just the ordinary page background now — nothing special to blend into. */
  body{
    background:var(--bg); font-family: var(--font-body); overscroll-behavior:none;
    touch-action: manipulation;
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; }
  }
  button{ font-family:inherit; }
  ::selection{ background: var(--gold); color:#1B2036; }

  /* ---------- app shell ----------
     #app is plain, ordinary document flow now — no position:fixed, no capped height. The page
     is exactly as tall as whatever tab is showing, and grows to fit an open overlay too. */
  #app{
    position:relative; overflow-x:hidden; overflow-y:visible;
    background:var(--bg); color:var(--text);
  }

  .app-body{ position:relative; overflow-x:hidden; overflow-y:visible; }
  .screen-pad{ padding:6px 20px 28px; padding-top:calc(6px + env(safe-area-inset-top,0px)); }
  /* Bottom safe-area padding for overlay content specifically — base tabs already get this from
     tab-nav's own padding, but overlays have no tab-nav, so they need it here directly. (An
     earlier version of this rule also forced min-height:100%, on the theory that a short form
     needed to be "stretched" to reach the bottom — that was backwards: min-height only guarantees
     the container is tall enough, which for short content just adds visible blank space *after*
     the last field instead of removing it. A short form is supposed to just end where its content
     ends, exactly like a long one does — there was never a height to fill in the first place.) */
  .app-screen--overlay .screen-pad{ padding-bottom:calc(28px + env(safe-area-inset-bottom,0px)); }
  @media (min-width:700px){
    .screen-pad{ padding:8px 30px 32px; padding-top:calc(8px + env(safe-area-inset-top,0px)); }
    .tab-nav{ padding:0 30px calc(6px + env(safe-area-inset-bottom,0px)); }
  }

  /* Overlays (detail/form/add-shows) are now ordinary, normal-flow page content — nothing special
     about their positioning at all. That's only possible because render() no longer generates the
     base tab screens at all while one is open (see the comment there); with nothing else in the
     document competing for space, the overlay doesn't need position:fixed/absolute tricks to stay
     isolated — it just is, by construction. This is also why it correctly reaches the true bottom
     of the screen: normal document flow was never subject to the iOS standalone quirk that caps a
     position:fixed box short of the true screen height (proven unfixable by CSS alone, months ago,
     for the base app shell) — that quirk is what broke the previous, position:fixed version of
     this rule specifically for shorter content like Add Movie. min-height keeps a short overlay
     reading as a full screen; content taller than that just grows the page, exactly like Home,
     Browse, and Settings already do. */
  .app-screen--overlay{
    min-height:100dvh;
    background:var(--bg); z-index:40; transition: transform .34s cubic-bezier(.2,.8,.2,1);
  }
  .app-screen--overlay.detail-ov{ transform:translateX(0); }
  .app-screen--overlay.detail-ov.is-animating-in{ transform:translateX(100%); }
  .app-screen--overlay.form-ov{ transform:translateY(0); }
  .app-screen--overlay.form-ov.is-animating-in{ transform:translateY(100%); }

  .tab-nav{ display:flex; gap:5px; margin:8px 0 4px; padding:0 8px calc(6px + env(safe-area-inset-bottom,0px)); justify-content:center; flex-wrap:wrap; }
  .tab-nav-btn{
    font-family:inherit; font-size:12.5px; font-weight:600; color:var(--text-muted);
    padding:10px 10px; border-radius:999px; background:var(--surface); border:1px solid var(--border);
    display:inline-flex; align-items:center; gap:5px; cursor:pointer; white-space:nowrap;
  }
  .tab-nav-btn .icon{ width:14px; height:14px; }
  .tab-nav-btn.active{ color:#fff; background:var(--teal); border-color:var(--teal); }

  .icon{ width:20px; height:20px; }

  /* ---------- section headers ---------- */
  .screen-title{ font-family:var(--font-display); font-size:30px; font-weight:600; margin:14px 0 2px; }
  .screen-kicker{ color:var(--text-muted); font-size:13.5px; margin:0 0 18px; }
  .section-label{ font-size:13px; font-weight:700; color:var(--text-muted); margin:22px 0 10px; }
  .section-label:first-of-type{ margin-top:6px; }

  /* ---------- home: episode cards ---------- */
  .ep-card{
    display:flex; align-items:stretch; background:var(--surface); border:1px solid var(--border);
    border-radius:18px; margin-bottom:14px; overflow:hidden; box-shadow:0 6px 18px rgba(20,20,30,0.06);
    animation: rise .32s ease both; cursor:pointer;
  }
  @keyframes rise{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:translateY(0); } }
  .ep-card__stub{
    width:76px; flex:0 0 auto; position:relative; display:flex; align-items:center; justify-content:center;
    color:rgba(255,255,255,0.85); overflow:hidden;
  }
  .ep-card__initial{ font-family:var(--font-display); font-style:italic; font-weight:600; font-size:30px; }
  .ep-card__perf{
    flex:0 0 auto; width:0; border-left:2px dashed rgba(27,32,54,0.18); position:relative; margin:10px 0;
  }
  html:not([data-theme="light"]) .ep-card__perf{ border-left-color: rgba(243,241,234,0.16); }
  .ep-card__perf::before, .ep-card__perf::after{
    content:""; position:absolute; left:-7px; width:14px; height:14px; border-radius:50%; background:var(--bg);
  }
  .ep-card__perf::before{ top:-10px; } .ep-card__perf::after{ bottom:-10px; }
  .ep-card__body{ flex:1 1 auto; padding:12px 14px; min-width:0; }
  .ep-card__show{ margin:0; font-size:12px; font-weight:700; color:var(--text-muted); text-transform:none; }
  .ep-card__ep{ margin:2px 0 4px; font-family:var(--font-display); font-size:20px; font-weight:600; line-height:1.15; }
  .ep-card__meta{ margin:0; font-size:12.5px; color:var(--text-muted); }
  .check-btn{
    flex:0 0 auto; width:56px; border:none; border-left:1px solid var(--border); background:var(--surface-2);
    color:var(--teal-strong); cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .check-btn:hover{ background: rgba(22,120,111,0.10); }
  .check-btn.is-punching{ animation: punch .38s ease; }
  @keyframes punch{ 0%{ transform:scale(1) rotate(0); } 45%{ transform:scale(1.3) rotate(-10deg); } 100%{ transform:scale(1) rotate(0); } }

  .empty-block{
    text-align:center; padding:34px 16px; background:var(--surface); border:1px dashed var(--border); border-radius:18px;
  }
  .empty-block .icon{ width:30px; height:30px; color:var(--text-muted); margin-bottom:8px; }
  .empty-block p{ margin:4px 0 0; color:var(--text-muted); font-size:14px; }
  .empty-block strong{ display:block; font-family:var(--font-display); font-size:19px; font-weight:600; color:var(--text); margin-bottom:2px;}
  .empty-block .btn{ margin-top:14px; }

  .upcoming-row{ display:flex; align-items:center; gap:12px; padding:10px 4px; border-bottom:1px dashed var(--border); cursor:pointer; }
  .upcoming-row:last-child{ border-bottom:none; }
  .upcoming-thumb{ width:34px; height:34px; border-radius:9px; flex:0 0 auto; display:flex; align-items:center; justify-content:center; color:#fff; position:relative; overflow:hidden; }
  .upcoming-thumb span{ font-family:var(--font-display); font-style:italic; font-weight:600; font-size:14px; }
  .upcoming-info{ flex:1 1 auto; min-width:0; }
  .upcoming-info .t1{ font-size:13.5px; font-weight:700; margin:0; }
  .upcoming-info .t2{ font-size:12px; color:var(--text-muted); margin:1px 0 0; }
  .upcoming-right{ text-align:right; flex:0 0 auto; }
  .upcoming-when{ font-size:11.5px; color:var(--text-muted); font-weight:600; white-space:nowrap; margin:0 0 3px; }
  .dday{ display:inline-block; font-size:11px; font-weight:800; padding:3px 8px; border-radius:999px; white-space:nowrap; }
  .dday--soon{ background:rgba(22,120,111,0.12); color:var(--teal-strong); }
  .dday--today{ background:var(--teal); color:#fff; }
  .dday--over{ background:rgba(168,64,47,0.12); color:var(--danger); }

  /* ---------- buttons / controls ---------- */
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px; border:none; border-radius:999px;
    padding:12px 18px; font-size:14.5px; font-weight:700; cursor:pointer;
  }
  .btn-primary{ background:var(--gold); color:#241a05; }
  .btn-ghost{ background:var(--surface-2); color:var(--text); border:1px solid var(--border); }
  .btn-danger{ background:transparent; color:var(--danger); border:1px solid rgba(168,64,47,0.4); }
  .btn-block{ width:100%; }
  .btn-sm{ padding:8px 13px; font-size:13px; }

  .icon-btn{
    width:38px; height:38px; border-radius:999px; border:1px solid rgba(255,255,255,0.35);
    background:rgba(255,255,255,0.16); color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .icon-btn--danger{ color:#ffd8d0; }
  .back-btn{ position:sticky; top:10px; margin:10px 0 0 0; z-index:5; background:var(--surface); color:var(--text); border:1px solid var(--border); width:auto; padding:0 14px 0 10px; border-radius:999px; height:36px; gap:4px; font-size:13px; font-weight:700; }

  /* ---------- browse ---------- */
  .browse-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:11px; }
  .seg-switch{ display:flex; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:4px; margin-bottom:16px; }
  .seg-switch button{ flex:1; font-family:inherit; font-size:13.5px; font-weight:700; color:var(--text-muted); background:none; border:none; padding:9px 0; border-radius:10px; cursor:pointer; }
  .seg-switch button.active{ background:var(--teal); color:#fff; }
  .tile{ text-align:left; background:none; border:none; padding:0; cursor:pointer; color:inherit; }
  .tile-poster{ position:relative; aspect-ratio:2/3; border-radius:16px; overflow:hidden; display:flex; align-items:flex-end; padding:10px; }
  .tile-poster .badge{
    position:absolute; top:9px; left:9px; background:rgba(10,10,16,0.55); color:#fff; font-size:10.5px; font-weight:700;
    padding:4px 8px; border-radius:999px; backdrop-filter:blur(2px);
  }
  .movie-badge{ position:absolute; top:9px; right:9px; width:24px; height:24px; border-radius:50%; background:rgba(10,10,16,0.55); display:flex; align-items:center; justify-content:center; backdrop-filter:blur(2px); }
  .movie-badge .icon{ width:13px; height:13px; color:#fff; }
  .star-pick{ display:flex; gap:6px; font-size:24px; color:var(--border); line-height:1; }
  .star-pick span{ cursor:pointer; }
  .star-pick span.on{ color:var(--gold); }
  .field-label{ display:block; font-size:11px; font-weight:700; color:var(--text-muted); margin:0 0 6px; text-transform:uppercase; letter-spacing:.03em; }
  .related-row{ display:flex; gap:10px; overflow-x:auto; padding-bottom:4px; }
  .related-chip{ flex:0 0 auto; width:78px; text-align:center; }
  .related-chip-poster{ position:relative; width:78px; aspect-ratio:2/3; border-radius:13px; overflow:hidden; margin-bottom:5px; display:flex; align-items:center; justify-content:center; color:#fff; font-family:var(--font-display); font-style:italic; font-weight:600; font-size:16px; cursor:pointer; }
  .related-chip-rm{ position:absolute; top:5px; right:5px; width:20px; height:20px; border-radius:50%; background:rgba(10,10,16,0.62); color:#fff; border:none; display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0; }
  .related-chip-rm .icon{ width:11px; height:11px; }
  .related-chip p{ font-size:10.5px; font-weight:700; margin:0; line-height:1.2; }
  .related-chip span{ font-size:9px; color:var(--teal-strong); font-weight:700; }
  .add-related{ flex:0 0 auto; width:78px; aspect-ratio:2/3; border-radius:13px; border:1.5px dashed var(--border); background:none; display:flex; align-items:center; justify-content:center; color:var(--text-muted); cursor:pointer; }
  .add-related .icon{ width:20px; height:20px; }
  .add-related-panel{ background:var(--surface-2); border-radius:14px; padding:14px; margin-top:12px; }
  .add-related-panel select{
    width:100%; font-family:inherit; font-size:15px; padding:10px 13px; border-radius:11px; border:1px solid var(--border);
    background-color:var(--surface); color:var(--text); margin-bottom:14px; appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236B6F87' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M6 9l6 6 6-6'/></svg>");
    background-repeat:no-repeat; background-position:right 13px center; background-size:16px; padding-right:36px;
  }
  .tile-cap{ font-size:13.5px; font-weight:700; margin:8px 2px 0; line-height:1.25; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .tile-sub{ font-size:11.5px; color:var(--text-muted); margin:3px 2px 0; }
  .tile-progress{ height:3px; border-radius:3px; background:var(--border); margin:6px 2px 0; overflow:hidden; }
  .tile-progress i{ display:block; height:100%; background:var(--teal); }
  .tile-rm{ position:absolute; top:6px; right:6px; width:24px; height:24px; border-radius:50%; background:rgba(10,10,16,0.62); color:#fff; border:none; display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0; }
  .tile-rm .icon{ width:13px; height:13px; }

  /* ---------- shelves ---------- */
  .row-between{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
  .edit-toggle{ flex:0 0 auto; border:1px solid var(--border); background:var(--surface); color:var(--text); font-size:12.5px; font-weight:700; padding:8px 15px; border-radius:999px; cursor:pointer; margin-top:14px; }
  .edit-toggle.active{ background:var(--teal); border-color:var(--teal); color:#fff; }
  .shelf{ margin-bottom:22px; }
  .shelf-head{ display:flex; align-items:center; gap:8px; margin-bottom:10px; min-height:34px; }
  .shelf-title{ font-family:var(--font-display); font-style:italic; font-weight:600; font-size:18px; margin:0; flex:1 1 auto; }
  .shelf-title--muted{ color:var(--text-muted); font-style:normal; }
  .shelf-rename-input{ flex:1 1 auto; font-family:var(--font-display); font-style:italic; font-weight:600; font-size:16px; border:1px solid var(--border); background:var(--surface); color:var(--text); padding:7px 11px; border-radius:10px; }
  .shelf-ctl{ display:flex; gap:5px; flex:0 0 auto; }
  .icon-btn-sm{ width:30px; height:30px; border-radius:50%; border:1px solid var(--border); background:var(--surface); color:var(--text-muted); display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0; }
  .icon-btn-sm .icon{ width:15px; height:15px; }
  .icon-btn-sm--danger{ color:var(--danger); border-color:rgba(168,64,47,0.35); }
  .shelf-row{ display:flex; gap:12px; overflow-x:auto; padding-bottom:4px; -webkit-overflow-scrolling:touch; }
  .shelf-row .tile{ width:112px; flex:0 0 auto; }
  .shelf-empty{ font-size:12.5px; color:var(--text-muted); background:var(--surface); border:1px dashed var(--border); border-radius:14px; padding:16px; text-align:center; }
  .shelf-addshows-btn{ display:inline-flex; align-items:center; gap:6px; margin-top:10px; background:var(--surface-2); border:1px dashed var(--border); color:var(--text-muted); font-size:12.5px; font-weight:700; padding:8px 14px; border-radius:999px; cursor:pointer; }
  .shelf-addshows-btn .icon{ width:14px; height:14px; }
  .new-folder-row{ display:flex; gap:8px; align-items:center; background:var(--surface); border:1.5px dashed var(--border); border-radius:14px; padding:12px 14px; margin-top:6px; }
  .new-folder-row input{ flex:1 1 auto; border:none; background:none; font-size:14.5px; font-family:inherit; color:var(--text); min-width:0; }
  .new-folder-row input:focus{ outline:none; }
  .new-folder-row button{ flex:0 0 auto; background:var(--gold); color:#241a05; border:none; border-radius:999px; padding:9px 16px; font-size:12.5px; font-weight:700; cursor:pointer; }

  /* ---------- manage categories panel ---------- */
  .category-card{ background:var(--surface-2); border-radius:14px; padding:13px 14px; margin:10px 0; }
  .category-card-head{ display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .category-card-head input{ flex:1 1 auto; border:1px solid var(--border); background:var(--surface); color:var(--text); padding:9px 12px; border-radius:10px; font-size:15px; font-family:inherit; min-width:0; }
  .mini-danger-btn{ flex:0 0 auto; width:36px; height:36px; border-radius:10px; border:1px solid rgba(168,64,47,0.3); background:rgba(168,64,47,0.08); color:var(--danger); display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0; }
  .mini-danger-btn .icon{ width:15px; height:15px; }
  .category-add-input{ width:100%; border:1px solid var(--border); background:var(--surface); color:var(--text); padding:9px 12px; border-radius:10px; font-size:15px; font-family:inherit; margin-top:8px; }

  /* ---------- add-shows-to-folder checklist ---------- */

  .fab{

    background:var(--gold); color:#241a05; display:flex; align-items:center; justify-content:center; cursor:pointer;

  }

  .browse-split{ display:flex; min-height:100dvh; }
  .browse-list-pane{ width:270px; flex:0 0 auto; border-right:1px solid var(--border); padding:6px 14px 20px; }

  .list-row{
    display:flex; align-items:center; gap:11px; padding:9px 8px; border-radius:12px; cursor:pointer; border:none; background:none;
    width:100%; text-align:left; color:inherit;
  }

  .list-row-thumb{ width:38px; height:38px; border-radius:9px; flex:0 0 auto; display:flex; align-items:center; justify-content:center; color:#fff; position:relative; overflow:hidden; }

  .list-row-title{ font-size:13.5px; font-weight:700; margin:0; }

  /* ---------- detail ---------- */
  .detail-hero{ height:200px; margin:0 -20px 0; position:relative; overflow:hidden; display:flex; align-items:flex-end; padding:16px 20px; }
  @media (min-width:700px){ .detail-hero{ margin:0 -30px 0; border-radius:20px; height:230px; } }
  .detail-hero__initial{ position:absolute; right:18px; top:14px; font-family:var(--font-display); font-style:italic; font-size:44px; color:rgba(255,255,255,0.35); }

  .chip-row{ display:flex; flex-wrap:wrap; gap:6px; margin:12px 0 4px; }

  .sel-chip button{ background:rgba(255,255,255,0.28); border:none; color:#fff; border-radius:50%; width:18px; height:18px; display:flex; align-items:center; justify-content:center; padding:0; cursor:pointer; }
  .sel-chip .icon{ width:10px; height:10px; }

  .chip-x{ display:inline-flex; align-items:center; gap:5px; }
  .chip-x button{ border:none; background:none; padding:0; cursor:pointer; color:var(--text-muted); display:flex; }
  .chip-x .icon{ width:12px; height:12px; }
  .cast-chip{ display:inline-flex; align-items:center; gap:6px; }
  .cast-chip-photo{ width:20px; height:20px; border-radius:50%; overflow:hidden; position:relative; display:inline-block; flex:0 0 auto; }
  .cast-chip-init{ width:20px; height:20px; border-radius:50%; background:var(--teal); color:#fff; display:inline-flex; align-items:center; justify-content:center; font-size:10px; font-weight:700; }
  .cast-list{ margin:2px 0 10px; }

  .cast-row:last-child{ border-bottom:none; }
  .cast-photo{ width:38px; height:38px; border-radius:50%; flex:0 0 auto; overflow:hidden; position:relative; border:1px solid var(--border); background:var(--surface-2); color:var(--text-muted); display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-style:italic; font-weight:600; font-size:15px; cursor:pointer; padding:0; }

  /* ---------- form ---------- */

    width:100%; border:1px solid var(--border); background:var(--surface); color:var(--text);
    padding:11px 13px; border-radius:12px; font-size:16px; font-family:inherit; appearance:none; -webkit-appearance:none;
  }
  .field select{ background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236B6F87' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M6 9l6 6 6-6'/></svg>"); background-repeat:no-repeat; background-position:right 13px center; background-size:16px; padding-right:36px; }
  .field input:focus, .field select:focus, .day-chip:focus-visible, .opt-chip:focus-visible, .swatch:focus-visible, button:focus-visible{ outline:2px solid var(--teal); outline-offset:2px; }

  .opt-chip{ height:36px; padding:0 13px; border-radius:10px; border:1px solid var(--border); background:var(--surface); color:var(--text-muted); font-size:12.5px; font-weight:700; cursor:pointer; }

  .form-actions{ display:flex; gap:10px; margin-top:22px; }

  /* ---------- settings ---------- */
  .settings-card{ background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:14px 16px; margin-bottom:14px; }
  .settings-card h3{ font-family:var(--font-display); font-size:16px; font-weight:600; margin:0 0 10px; }
  .segmented{ display:flex; background:var(--surface-2); border-radius:12px; padding:4px; gap:4px; }
  .segmented button{ flex:1; border:none; background:none; padding:8px 0; border-radius:9px; font-size:13px; font-weight:700; color:var(--text-muted); cursor:pointer; }
  .segmented button.active{ background:var(--surface); color:var(--text); box-shadow:0 2px 6px rgba(0,0,0,0.08); }
  .sync-row{ display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px dashed var(--border); }

  /* ---------- poster image + cropping ---------- */
  .poster-img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }
  .poster-upload-row{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:2px; }
  .poster-upload-preview{ width:52px; height:52px; border-radius:12px; overflow:hidden; position:relative; background:var(--surface-2); flex:0 0 auto; display:flex; align-items:center; justify-content:center; color:#fff; }

  .crop-hint{ font-size:11px; color:var(--text-muted); margin:6px 0 0; }

  /* ---------- episode ratings & feelings ---------- */
  .ep-row--rateable{ cursor:pointer; }

  .ep-row--watched .ep-row__title{ display:flex; flex-direction:column; }

  .score-box{ background:var(--surface); border:1px solid var(--border); border-radius:16px; margin:2px 0 12px; overflow:hidden; }
  .score-head{ display:flex; align-items:center; gap:8px; width:100%; padding:12px 14px; background:none; border:none; color:var(--text); font-family:inherit; cursor:pointer; text-align:left; }
  .score-head .lbl{ flex:1; font-size:13px; font-weight:800; }

  .score-head .chev .icon{ width:16px; height:16px; }

  .feel-bars{ display:flex; flex-direction:column; gap:6px; }
  .feel-bar{ display:flex; align-items:center; gap:8px; font-size:12px; }
  .feel-bar .t{ min-width:22px; text-align:center; font-size:15px; }
  .feel-bar .track{ flex:1; height:8px; background:var(--surface-2); border:1px solid var(--border); border-radius:6px; overflow:hidden; }
  .feel-bar .track i{ display:block; height:100%; background:var(--teal); }
  .feel-bar .n{ width:18px; text-align:right; font-weight:700; color:var(--text-muted); }

  .rate-scrim{ position:fixed; top:0; left:0; right:0; bottom:-200px; background:rgba(14,18,31,0.42); z-index:90; animation:rateFade .2s ease; }
  .rate-sheet{ position:fixed; left:0; right:0; bottom:0; z-index:91; max-width:560px; margin:0 auto; background:var(--surface); border-radius:24px 24px 0 0;
    padding:10px 18px calc(18px + env(safe-area-inset-bottom,0px)); max-height:88vh; overflow-y:auto; -webkit-overflow-scrolling:touch; box-shadow:0 -8px 30px rgba(14,18,31,0.18); }
  /* iOS installed-app quirk: fixed elements can stop a little short of the true bottom edge,
     so paint the sheet's colour on past its bottom to avoid a visible gap. */
  .rate-sheet::after{ content:""; position:fixed; left:0; right:0; bottom:-200px; height:200px; background:var(--surface); }
  .rate-sheet.is-opening{ animation:rateUp .28s cubic-bezier(.2,.8,.2,1); }
  @keyframes rateUp{ from{ transform:translateY(100%); } to{ transform:translateY(0); } }
  @keyframes rateFade{ from{ opacity:0; } to{ opacity:1; } }
  .rate-grab{ width:38px; height:4px; border-radius:4px; background:var(--border); margin:0 auto 12px; }

  .rate-top p{ font-size:12px; color:var(--text-muted); margin:2px 0 0; }

  .feel{ border:1px solid var(--border); background:var(--surface); border-radius:13px; padding:8px 2px 7px; text-align:center; cursor:pointer; font-family:inherit; font-size:11px; font-weight:600; color:var(--text-muted); display:flex; flex-direction:column; align-items:center; gap:3px; min-width:0; }

  .feel.on{ border-color:var(--teal); background:rgba(22,120,111,0.10); color:var(--teal-strong); }
  .rate-actions{ display:flex; gap:8px; margin-top:16px; }
  .rate-actions .btn{ flex:1; }
  .rate-unwatch{ display:block; margin:12px auto 0; background:none; border:none; color:var(--danger); font-family:inherit; font-size:12.5px; font-weight:700; cursor:pointer; }
  .app-toast{ position:fixed; left:50%; top:calc(12px + env(safe-area-inset-top,0px)); transform:translate(-50%,-20px); opacity:0; z-index:95; background:var(--text); color:var(--bg);
    font-size:13px; font-weight:600; padding:10px 15px; border-radius:12px; transition:all .25s; pointer-events:none; white-space:nowrap; max-width:92vw; overflow:hidden; text-overflow:ellipsis; }

  /* ---------- Stats tab ---------- */
  .st-seg{ display:flex; background:var(--surface); border:1px solid var(--border); border-radius:13px; padding:3px; }
  .st-seg button{ flex:1; font-family:inherit; font-size:12.5px; font-weight:700; border:none; background:none; color:var(--text-muted); padding:8px 0; border-radius:10px; cursor:pointer; }

    background:linear-gradient(120deg,#1B2036 0%,#3C2F6B 60%,#A9762A 130%); font-family:inherit; min-height:84px; }

  .st-peek .st-pst:nth-child(1){ transform:rotate(-8deg); } .st-peek .st-pst:nth-child(3){ transform:rotate(8deg); }
  .st-card{ background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:14px; margin-bottom:12px; }
  .st-card h3{ font-size:13.5px; font-weight:800; margin:0 0 2px; }
